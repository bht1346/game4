<!DOCTYPE html>
<html lang="zh-CN"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三子棋 · P2P 联机版</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background:
                radial-gradient(ellipse at 15% 0%, rgba(255, 200, 0, .18), transparent 45%),
                radial-gradient(ellipse at 85% 100%, rgba(200, 150, 0, .1), transparent 40%),
                #111;
            color: #ddd; font-family: "Courier New", monospace;
            max-width: 820px; margin: 0 auto; padding: 20px;
            min-height: 100vh; line-height: 1.6; position: relative;
        }
        h1 { color: #ffcc00; text-align: center; letter-spacing: 3px; margin: 18px 0 4px; }
        .subtitle { text-align: center; color: #888; margin-bottom: 18px; font-size: 14px; }

        /* 设置按钮 */
        .settings-btn {
            position: absolute; top: 16px; right: 16px; z-index: 10;
            font-size: 12px; cursor: pointer;
            border: 1px solid #444; border-radius: 4px;
            padding: 3px 10px; background: transparent;
            color: #888; transition: all .2s;
        }
        .settings-btn:hover { color: #ffcc00; border-color: #ffcc00; }
        .theme-panel {
            position: absolute; top: 44px; right: 16px;
            background: #1a1a1a; border: 1px solid #444;
            border-radius: 8px; padding: 12px 14px;
            z-index: 100; min-width: 180px;
            display: none;
        }
        .theme-panel.open { display: block; }
        .theme-panel label { display: block; color: #888; font-size: 11px; margin-bottom: 5px; }
        .theme-option {
            display: flex; align-items: center; gap: 8px;
            padding: 5px 8px; border-radius: 4px;
            cursor: pointer; font-size: 13px; color: #ddd;
        }
        .theme-option:hover { background: rgba(255,204,0,.08); }
        .theme-swatch { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #555; }
        .theme-divider { height: 1px; background: #333; margin: 6px 0; }

        .panel {
            background: #1a1a1a; border: 1px solid #333; border-radius: 12px;
            padding: 18px; margin-bottom: 14px; box-shadow: 0 0 24px rgba(0,0,0,.6);
        }
        .center { text-align: center; }
        .room-code {
            font-size: 42px; color: #ffcc00; letter-spacing: 12px;
            font-weight: 900; text-align: center; margin: 14px 0;
            text-shadow: 0 0 18px rgba(255,204,0,.2);
        }
        .room-code-hint { text-align: center; color: #888; font-size: 13px; margin-bottom: 16px; }
        .row { display: flex; gap: 10px; margin: 12px 0; align-items: center; flex-wrap: wrap; }
        .row label { display: block; color: #aaa; font-size: 14px; margin-bottom: 4px; width: 100%; }
        .row input {
            flex: 1; min-width: 160px; background: #0d0d0d; color: #eee;
            border: 1px solid #555; border-radius: 6px; padding: 10px;
            font-family: inherit; font-size: 16px; text-align: center;
            letter-spacing: 6px; font-weight: 700;
        }
        .row input::placeholder { letter-spacing: 2px; font-weight: 400; color: #666; }
        .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
        .status-dot.waiting { background: #ffcc00; animation: blink 1s infinite; }
        .status-dot.ok { background: #44ff44; }
        .status-dot.fail { background: #ff4444; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
        button {
            background: #252525; color: #eee; border: 1px solid #555;
            padding: 10px 22px; border-radius: 6px; cursor: pointer;
            font-family: inherit; font-size: 16px; transition: all .15s;
            flex: 0 1 auto; min-width: 80px;
        }
        button:hover:not(:disabled) { background: #3a3a3a; border-color: #aaa; transform: scale(1.02); }
        button:disabled { opacity: .35; cursor: not-allowed; transform: none; }
        .success { border-color: #44aa44; color: #77ff77; }
        .success:hover:not(:disabled) { background: #113311; border-color: #55ff55; }
        .danger { border-color: #aa4444; color: #ff7777; }
        .danger:hover:not(:disabled) { background: #441111; border-color: #ff5555; }
        .warn { border-color: #ccaa44; color: #ffdd77; }
        .warn:hover:not(:disabled) { background: #332a11; border-color: #ffdd55; }
        .spectate { border-color: #8844aa; color: #cc88ff; }
        .spectate:hover:not(:disabled) { background: #221133; border-color: #aa55ff; }
        .hidden { display: none; }
        .highlight { color: #ffcc00; }
        .info-text { color: #88ccff; }
        .success-text { color: #55ff55; }
        .danger-text { color: #ff5555; }
        .small { color: #888; font-size: 13px; }
        .tip {
            background: #101010; border: 1px dashed #555; border-radius: 8px;
            padding: 10px 12px; margin-top: 14px; color: #888; font-size: 13px;
            text-align: center;
        }
        .preset-section { margin-top: 18px; padding-top: 14px; border-top: 1px solid #222; }
        .preset-title { color: #aaa; font-size: 14px; margin-bottom: 10px; }
        .preset-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
        .preset-card {
            background: #151515; border: 1px solid #444; border-radius: 10px;
            padding: 14px; text-align: center; cursor: pointer;
            transition: all .15s; position: relative; overflow: hidden;
        }
        .preset-card::before {
            content: ""; position: absolute; inset: 0;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,.04), transparent);
            transform: translateX(-120%); transition: transform .45s;
        }
        .preset-card:hover::before { transform: translateX(120%); }
        .preset-card:hover { border-color: #ffcc00; background: #1c1a0f; transform: translateY(-2px); }
        .preset-card .room-num { color: #ffcc00; font-size: 28px; font-weight: 900; letter-spacing: 4px; }
        .preset-card .room-label { color: #888; font-size: 12px; margin-top: 4px; }
        .preset-card .click-hint { color: #666; font-size: 12px; margin-top: 8px; }

        /* 游戏区 */
        #game-area {
            display: flex; flex-direction: column; align-items: center; gap: 12px;
        }
        #game-canvas {
            border-radius: 12px;
            cursor: pointer;
            touch-action: none;
            max-width: 100%;
        }
        #game-info {
            text-align: center;
            font-size: 16px;
            min-height: 24px;
            padding: 8px 16px;
            background: #0d0d0d;
            border-radius: 8px;
            border-left: 4px solid #ffcc00;
            width: 100%;
            max-width: 420px;
        }
        .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; justify-content: center; }

        footer {
            margin-top: 28px; text-align: center; font-size: 13px;
        }
        footer a { color: #88ccff; text-decoration: none; border-bottom: 1px solid #335577; }
        footer a:hover { color: #ffcc00; border-color: #ffcc00; }
    </style>
</head>
<body>
<!-- 设置按钮 -->
<div class="settings-btn" id="settingsBtn" onclick="toggleSettings()">设置</div>
<div class="theme-panel" id="themePanel">
    <label>主题颜色</label>
    <div class="theme-option" data-theme="blackgold" onclick="setTheme('blackgold')">
        <span class="theme-swatch" style="background:linear-gradient(135deg,#0a0a0a,#333)"></span> 黑金
    </div>
    <div class="theme-option" data-theme="azure" onclick="setTheme('azure')">
        <span class="theme-swatch" style="background:linear-gradient(135deg,#f0f4f8,#b8d4f0)"></span> 蔚蓝
    </div>
    <div class="theme-divider"></div>
    <label>背景风格</label>
    <div class="theme-option" data-style="gradient" onclick="setThemeStyle('gradient')">渐变</div>
    <div class="theme-option" data-style="solid" onclick="setThemeStyle('solid')">纯色</div>
</div>

<h1>三子棋</h1>
<div class="subtitle">P2P 联机版：庄家 vs 玩家，每人只有 3 个子，先三连者胜</div>

<section class="panel" id="setup">
    <div class="row">
        <label>你的名字</label>
        <input id="my-name" maxlength="12" value="玩家">
    </div>
    <div class="row">
        <button class="success" id="btn-create">创建房间（庄家）</button>
        <span style="flex:1"></span>
        <span class="small" style="align-self:center">或加入（玩家）/ 观战</span>
        <span style="flex:1"></span>
    </div>
    <div class="row" id="room-row">
        <label>房间码</label>
        <input id="room-code" maxlength="8" placeholder="6 或 8 位数字">
        <button class="warn" id="btn-join">加入房间（玩家）</button>
        <button class="spectate" id="btn-spectate">观战</button>
    </div>
    <div id="waiting-area" style="display:none">
        <div class="room-code" id="display-code">------</div>
        <div class="room-code-hint" id="waiting-hint">把这个房间码告诉朋友，等待对方加入</div>
        <div id="connect-status" style="text-align:center;margin:10px 0">
            <span class="status-dot waiting"></span>等待对方加入...
        </div>
        <div style="text-align:center">
            <button class="danger" id="btn-cancel">取消</button>
        </div>
    </div>
    <div class="preset-section">
        <div class="preset-title">默认房间</div>
        <div class="preset-grid" id="preset-grid"></div>
    </div>
    <div class="tip">庄家创建房间后，玩家加入对战。房间已有对局时，其他人自动进入观战。</div>
</section>

<section class="panel hidden" id="game">
    <div id="game-area">
        <canvas id="game-canvas" width="420" height="420"></canvas>
        <div id="game-info">等待连接...</div>
        <div class="btn-row">
            <button class="danger" id="btn-exit">退出</button>
        </div>
    </div>
</section>

<footer>
    <a href="./game-tictactoe.html">返回单机版</a> &nbsp;|&nbsp; <a href="./../index.html">返回首页</a>
</footer>

<script>
(function() {
    // ===================================================================
    //  DOM 元素
    // ===================================================================
    const els = {
        setup: document.getElementById('setup'),
        game: document.getElementById('game'),
        myName: document.getElementById('my-name'),
        roomRow: document.getElementById('room-row'),
        roomCode: document.getElementById('room-code'),
        waitingArea: document.getElementById('waiting-area'),
        displayCode: document.getElementById('display-code'),
        connectStatus: document.getElementById('connect-status'),
        gameInfo: document.getElementById('game-info'),
        canvas: document.getElementById('game-canvas'),
        gameArea: document.getElementById('game-area'),
    };
    const ctx = els.canvas.getContext('2d');

    // ===================================================================
    //  常量
    // ===================================================================
    const PREFIX = 'ttt-';
    const PRESET_ROOMS = [
        { code: '200001', label: '房间 1' },
        { code: '200002', label: '房间 2' },
        { code: '200003', label: '房间 3' },
        { code: '200004', label: '房间 4' },
    ];
    const SIZE = 420;
    const PAD = 30;
    const CELL = (SIZE - PAD * 2) / 3; // 120
    const WIN_LINES = [
        [[0,0],[0,1],[0,2]], [[1,0],[1,1],[1,2]], [[2,0],[2,1],[2,2]],
        [[0,0],[1,0],[2,0]], [[0,1],[1,1],[2,1]], [[0,2],[1,2],[2,2]],
        [[0,0],[1,1],[2,2]], [[0,2],[1,1],[2,0]],
    ];

    // ===================================================================
    //  状态变量
    // ===================================================================
    let peer = null;
    let conn = null;
    let role = null;       // 'dealer' | 'player' | 'spectator'
    let mySeat = null;     // 'p1' = 庄家, 'p2' = 玩家
    let connected = false;
    let state = null;
    let spectators = new Set();
    let spectatorConns = new Map();
    let hoverRow = -1;
    let hoverCol = -1;

    // ===================================================================
    //  工具函数
    // ===================================================================
    function safeName(name, fallback) {
        return (name || fallback).trim().slice(0, 12) || fallback;
    }

    function genCode() {
        return String(Math.floor(100000 + Math.random() * 900000));
    }

    function isValidCode(code) {
        return /^\d{6}$/.test(code) || /^\d{8}$/.test(code);
    }

    function showGame() {
        els.setup.classList.add('hidden');
        els.game.classList.remove('hidden');
        resizeCanvas();
    }

    function send(message) {
        if (conn && conn.open) conn.send(JSON.stringify(message));
    }

    function sendToSpectators(message) {
        if (role !== 'dealer') return;
        const raw = JSON.stringify(message);
        spectatorConns.forEach((c) => {
            if (c && c.open) c.send(raw);
        });
    }

    function broadcastState() {
        render();
        send({ type: 'state', state: publicState('p2') });
        sendToSpectators({ type: 'state', state: publicState('spectator') });
    }

    // ===================================================================
    //  主题系统
    // ===================================================================
    function getTheme() {
        const theme = localStorage.getItem('theme') || 'blackgold';
        const style = localStorage.getItem('themeStyle') || 'gradient';
        return { theme, style };
    }

    function getThemeColors() {
        const { theme, style } = getTheme();
        if (theme === 'azure') {
            return {
                bg1: style === 'gradient' ? '#d1f0ff' : '#d1f0ff',
                bg2: style === 'gradient' ? '#e8f6ff' : '#d1f0ff',
                board: 'rgba(0,119,204,0.06)',
                boardGlow: 'rgba(0,119,204,0.1)',
                gridLine: 'rgba(0,119,204,0.3)',
                p1Color: '#0077cc',
                p1Glow: 'rgba(0,119,204,0.5)',
                p2Color: '#cc4400',
                p2Glow: 'rgba(204,68,0,0.5)',
                accent: '#0077cc',
                accentGlow: 'rgba(0,119,204,0.3)',
                text: '#1a3a5c',
                textDim: '#4477aa',
                winLine: '#00aa44',
            };
        }
        // blackgold (default)
        return {
            bg1: style === 'gradient' ? '#0a0a0a' : '#0a0a0a',
            bg2: style === 'gradient' ? '#1a1205' : '#0a0a0a',
            board: 'rgba(255,204,0,0.06)',
            boardGlow: 'rgba(255,204,0,0.12)',
            gridLine: 'rgba(255,204,0,0.35)',
            p1Color: '#ffcc00',
            p1Glow: 'rgba(255,204,0,0.6)',
            p2Color: '#ff6b6b',
            p2Glow: 'rgba(255,107,107,0.6)',
            accent: '#ffcc00',
            accentGlow: 'rgba(255,204,0,0.4)',
            text: '#ddd',
            textDim: '#888',
            winLine: '#55ff55',
        };
    }

    // 设置面板
    let settingsOpen = false;
    function toggleSettings() {
        settingsOpen = !settingsOpen;
        document.getElementById('themePanel').classList.toggle('open', settingsOpen);
    }
    function setTheme(theme) {
        localStorage.setItem('theme', theme);
        applyPageTheme();
    }
    function setThemeStyle(style) {
        localStorage.setItem('themeStyle', style);
        applyPageTheme();
    }
    // 暴露到全局，供 HTML onclick 调用
    window.toggleSettings = toggleSettings;
    window.setTheme = setTheme;
    window.setThemeStyle = setThemeStyle;
    document.addEventListener('click', e => {
        if (settingsOpen && !e.target.closest('#themePanel') && !e.target.closest('#settingsBtn')) {
            settingsOpen = false;
            document.getElementById('themePanel').classList.remove('open');
        }
    });

    function applyPageTheme() {
        const c = getThemeColors();
        const { theme, style } = getTheme();
        document.body.style.background = style === 'gradient'
            ? 'radial-gradient(ellipse at center, ' + c.bg2 + ' 0%, ' + c.bg1 + ' 100%)'
            : c.bg1;
        document.body.style.color = c.text;

        // 标题
        document.querySelectorAll('h1').forEach(el => { el.style.color = c.accent; });
        document.querySelectorAll('.subtitle').forEach(el => { el.style.color = c.textDim; });

        // 面板
        document.querySelectorAll('.panel').forEach(el => {
            el.style.background = c.bg1;
            el.style.borderColor = c.textDim;
        });

        // 按钮
        document.querySelectorAll('button').forEach(el => {
            if (el.classList.contains('success')) return;
            if (el.classList.contains('danger')) return;
            if (el.classList.contains('warn')) return;
            if (el.classList.contains('spectate')) return;
            el.style.background = c.bg1;
            el.style.borderColor = c.textDim;
            el.style.color = c.text;
        });

        // 输入框
        document.querySelectorAll('input').forEach(el => {
            el.style.background = c.bg1;
            el.style.borderColor = c.textDim;
            el.style.color = c.text;
        });

        // 房间码显示
        const dc = document.getElementById('display-code');
        if (dc) dc.style.color = c.accent;

        // 预设卡片
        document.querySelectorAll('.preset-card').forEach(el => {
            el.style.background = c.bg1;
            el.style.borderColor = c.textDim;
        });

        // tip
        document.querySelectorAll('.tip').forEach(el => {
            el.style.background = c.bg1;
            el.style.borderColor = c.textDim;
        });

        // 游戏信息
        const gi = document.getElementById('game-info');
        if (gi) {
            gi.style.background = c.bg1;
            gi.style.color = c.text;
            gi.style.borderLeftColor = c.accent;
        }

        // 页脚链接
        document.querySelectorAll('footer a').forEach(el => {
            el.style.color = c.accent;
        });

        // 小字和提示
        document.querySelectorAll('.small').forEach(el => { el.style.color = c.textDim; });
        document.querySelectorAll('.room-code-hint').forEach(el => { el.style.color = c.textDim; });

        // 设置面板
        document.querySelectorAll('.theme-option[data-theme]').forEach(el => {
            el.style.color = el.dataset.theme === theme ? c.accent : c.text;
            el.style.fontWeight = el.dataset.theme === theme ? '700' : '400';
        });
        document.querySelectorAll('.theme-option[data-style]').forEach(el => {
            el.style.color = el.dataset.style === style ? c.accent : c.text;
            el.style.fontWeight = el.dataset.style === style ? '700' : '400';
        });
        const panel = document.getElementById('themePanel');
        panel.style.background = c.bg1;
        panel.style.borderColor = c.textDim;
        document.getElementById('settingsBtn').style.color = c.textDim;
        document.getElementById('settingsBtn').style.borderColor = c.textDim;
    }
    applyPageTheme();

    // ===================================================================
    //  游戏逻辑
    // ===================================================================
    function newGame(dealerName, playerName) {
        state = {
            board: Array.from({ length: 3 }, () => Array(3).fill(0)),
            // 每人最多3子，用历史记录追踪顺序
            p1History: [],
            p2History: [],
            turn: 1, // 1=庄家, 2=玩家
            gameOver: false,
            winner: 0, // 0=无, 1=庄家胜, 2=玩家胜, 3=平局
            winLine: null,
            p1Name: dealerName,
            p2Name: playerName,
        };
    }

    function publicState(receiver) {
        // 观战者看到所有信息，玩家只看到公共棋盘状态
        return {
            board: state.board,
            turn: state.turn,
            gameOver: state.gameOver,
            winner: state.winner,
            winLine: state.winLine,
            p1Name: state.p1Name,
            p2Name: state.p2Name,
            p1History: state.p1History,
            p2History: state.p2History,
        };
    }

    function checkWin(board) {
        for (const line of WIN_LINES) {
            const vals = line.map(([r, c]) => board[r][c]);
            if (vals[0] !== 0 && vals[0] === vals[1] && vals[1] === vals[2]) {
                return { winner: vals[0], line: line };
            }
        }
        // 平局：所有格子被填满
        for (let r = 0; r < 3; r++)
            for (let c = 0; c < 3; c++)
                if (board[r][c] === 0) return null;
        return { winner: 3, line: null };
    }

    function makeMove(seat, row, col) {
        if (!state || state.gameOver) return false;
        if (seat !== state.turn) return false;
        if (row < 0 || row > 2 || col < 0 || col > 2) return false;
        if (state.board[row][col] !== 0) return false;

        const player = seat;
        const history = player === 1 ? state.p1History : state.p2History;

        state.board[row][col] = player;

        // 超过3个棋子时移除最早的
        history.push({ row, col });
        if (history.length > 3) {
            const oldest = history.shift();
            state.board[oldest.row][oldest.col] = 0;
        }

        // 检查胜负
        const result = checkWin(state.board);
        if (result) {
            state.gameOver = true;
            state.winner = result.winner;
            state.winLine = result.line;
        } else {
            state.turn = player === 1 ? 2 : 1;
        }
        return true;
    }

    // ===================================================================
    //  Canvas 渲染
    // ===================================================================
    function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        const displaySize = Math.min(420, window.innerWidth - 80);
        els.canvas.style.width = displaySize + 'px';
        els.canvas.style.height = displaySize + 'px';
        els.canvas.width = displaySize * dpr;
        els.canvas.height = displaySize * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        render();
    }

    function getDisplaySize() {
        return parseInt(els.canvas.style.width) || 420;
    }

    function render(externalState) {
        const view = externalState || (state ? publicState(role === 'dealer' ? 'dealer' : mySeat) : null);
        if (!view) return;

        const colors = getThemeColors();
        const { theme, style } = getTheme();
        const displaySize = getDisplaySize();
        const pad = displaySize * (PAD / SIZE);
        const cell = (displaySize - pad * 2) / 3;
        const pieceR = cell * 0.32;

        // 背景
        if (style === 'gradient') {
            const grad = ctx.createLinearGradient(0, 0, displaySize, displaySize);
            grad.addColorStop(0, colors.bg1);
            grad.addColorStop(1, colors.bg2);
            ctx.fillStyle = grad;
        } else {
            ctx.fillStyle = colors.bg1;
        }
        ctx.fillRect(0, 0, displaySize, displaySize);

        // 棋盘背景发光
        ctx.save();
        ctx.shadowColor = colors.boardGlow;
        ctx.shadowBlur = 30;
        ctx.fillStyle = colors.board;
        ctx.fillRect(pad - 8, pad - 8, cell * 3 + 16, cell * 3 + 16);
        ctx.restore();

        // 棋盘背景
        ctx.fillStyle = colors.board;
        ctx.fillRect(pad, pad, cell * 3, cell * 3);

        // 网格线
        ctx.strokeStyle = colors.gridLine;
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 1; i < 3; i++) {
            // 竖线
            ctx.moveTo(pad + cell * i, pad + 4);
            ctx.lineTo(pad + cell * i, pad + cell * 3 - 4);
            // 横线
            ctx.moveTo(pad + 4, pad + cell * i);
            ctx.lineTo(pad + cell * 3 - 4, pad + cell * i);
        }
        ctx.stroke();

        // 悬停预览（仅自己回合且是参与者）
        const isMyTurn = role !== 'spectator' && !view.gameOver && view.turn === mySeat && connected;
        if (isMyTurn && hoverRow >= 0 && hoverCol >= 0 && view.board[hoverRow][hoverCol] === 0) {
            const cx = pad + hoverCol * cell + cell / 2;
            const cy = pad + hoverRow * cell + cell / 2;
            const previewColor = mySeat === 1 ? colors.p1Color : colors.p2Color;
            ctx.save();
            ctx.globalAlpha = 0.25;
            ctx.beginPath();
            ctx.arc(cx, cy, pieceR, 0, Math.PI * 2);
            ctx.fillStyle = previewColor;
            ctx.fill();
            ctx.restore();
        }

        // 绘制棋子
        const history1 = state && state.p1History ? state.p1History : [];
        const history2 = state && state.p2History ? state.p2History : [];
        for (let r = 0; r < 3; r++) {
            for (let c = 0; c < 3; c++) {
                const val = view.board[r][c];
                if (val === 0) continue;
                const cx = pad + c * cell + cell / 2;
                const cy = pad + r * cell + cell / 2;
                const color = val === 1 ? colors.p1Color : colors.p2Color;
                const glow = val === 1 ? colors.p1Glow : colors.p2Glow;

                // 发光效果
                ctx.save();
                ctx.shadowColor = glow;
                ctx.shadowBlur = 16;

                if (theme === 'blackgold') {
                    // 庄家画圆，玩家画叉
                    if (val === 1) {
                        // 圆
                        ctx.beginPath();
                        ctx.arc(cx, cy, pieceR, 0, Math.PI * 2);
                        ctx.strokeStyle = color;
                        ctx.lineWidth = 4;
                        ctx.stroke();
                    } else {
                        // 叉
                        const s = pieceR * 0.75;
                        ctx.beginPath();
                        ctx.moveTo(cx - s, cy - s);
                        ctx.lineTo(cx + s, cy + s);
                        ctx.moveTo(cx + s, cy - s);
                        ctx.lineTo(cx - s, cy + s);
                        ctx.strokeStyle = color;
                        ctx.lineWidth = 4;
                        ctx.stroke();
                    }
                } else {
                    // 蔚蓝主题：双方都画圆，用颜色区分
                    ctx.beginPath();
                    ctx.arc(cx, cy, pieceR, 0, Math.PI * 2);
                    if (val === 1) {
                        ctx.strokeStyle = color;
                        ctx.lineWidth = 4;
                        ctx.stroke();
                    } else {
                        ctx.fillStyle = color;
                        ctx.fill();
                    }
                }
                ctx.restore();
            }
        }

        // 胜利线
        if (view.winLine) {
            ctx.save();
            ctx.strokeStyle = colors.winLine;
            ctx.lineWidth = 5;
            ctx.shadowColor = colors.winLine;
            ctx.shadowBlur = 20;
            ctx.globalAlpha = 0.85;
            ctx.beginPath();
            const sr = view.winLine[0];
            const er = view.winLine[2];
            ctx.moveTo(pad + sr[1] * cell + cell / 2, pad + sr[0] * cell + cell / 2);
            ctx.lineTo(pad + er[1] * cell + cell / 2, pad + er[0] * cell + cell / 2);
            ctx.stroke();
            ctx.restore();
        }

        // 更新文字信息
        updateInfo(view);
    }

    function updateInfo(view) {
        let text = '';
        if (role === 'spectator') {
            text += '[ 观战模式 ] ';
        } else {
            text += `你是：${mySeat === 1 ? view.p1Name : view.p2Name} (${mySeat === 1 ? '庄家' : '玩家'})  `;
        }
        if (view.gameOver) {
            if (view.winner === 3) {
                text += '平局！';
            } else {
                const winName = view.winner === 1 ? view.p1Name : view.p2Name;
                text += winName + ' 获胜！';
            }
            if (role === 'spectator') {
                text += '  (即将退出观战)';
            }
        } else {
            const turnName = view.turn === 1 ? view.p1Name : view.p2Name;
            if (role === 'spectator') {
                text += `当前回合：${turnName}`;
            } else {
                text += view.turn === mySeat ? '轮到你落子' : `等待 ${turnName} 落子`;
            }
        }
        els.gameInfo.textContent = text;
    }

    // ===================================================================
    //  Canvas 交互
    // ===================================================================
    function getCellFromEvent(e) {
        const rect = els.canvas.getBoundingClientRect();
        const displaySize = getDisplaySize();
        const pad = displaySize * (PAD / SIZE);
        const cell = (displaySize - pad * 2) / 3;
        let clientX, clientY;
        if (e.touches) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }
        const x = clientX - rect.left;
        const y = clientY - rect.top;
        const col = Math.floor((x - pad) / cell);
        const row = Math.floor((y - pad) / cell);
        if (row >= 0 && row < 3 && col >= 0 && col < 3) return { row, col };
        return null;
    }

    els.canvas.addEventListener('mousemove', (e) => {
        const cell = getCellFromEvent(e);
        if (cell) { hoverRow = cell.row; hoverCol = cell.col; }
        else { hoverRow = -1; hoverCol = -1; }
        render();
    });

    els.canvas.addEventListener('mouseleave', () => {
        hoverRow = -1; hoverCol = -1;
        render();
    });

    els.canvas.addEventListener('click', (e) => {
        if (!state || state.gameOver) return;
        if (role === 'spectator') return;
        if (role !== 'dealer' && role !== 'player') return;
        if (state.turn !== mySeat) return;

        const cell = getCellFromEvent(e);
        if (!cell) return;

        if (role === 'dealer') {
            // 庄家直接执行
            if (makeMove(mySeat, cell.row, cell.col)) {
                broadcastState();
                if (state.gameOver) {
                    sendToSpectators({ type: 'gameOver' });
                }
            }
        } else {
            // 玩家发送落子位置给庄家
            send({ type: 'move', row: cell.row, col: cell.col });
        }
    });

    els.canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        if (!state || state.gameOver) return;
        if (role === 'spectator') return;
        if (role !== 'dealer' && role !== 'player') return;
        if (state.turn !== mySeat) return;

        const touch = e.changedTouches[0];
        const rect = els.canvas.getBoundingClientRect();
        const displaySize = getDisplaySize();
        const pad = displaySize * (PAD / SIZE);
        const cellSize = (displaySize - pad * 2) / 3;
        const x = touch.clientX - rect.left;
        const y = touch.clientY - rect.top;
        const col = Math.floor((x - pad) / cellSize);
        const row = Math.floor((y - pad) / cellSize);

        if (row >= 0 && row < 3 && col >= 0 && col < 3) {
            if (role === 'dealer') {
                if (makeMove(mySeat, row, col)) {
                    broadcastState();
                    if (state.gameOver) {
                        sendToSpectators({ type: 'gameOver' });
                    }
                }
            } else {
                send({ type: 'move', row, col });
            }
        }
    });

    window.addEventListener('resize', resizeCanvas);

    // ===================================================================
    //  P2P 连接处理
    // ===================================================================

    // 玩家端连接建立后
    function onPlayerConnect(connection) {
        conn = connection;
        connected = true;
        showGame();
        els.gameInfo.textContent = 'P2P 连接成功，等待庄家初始化...';
        send({ type: 'hello', name: safeName(els.myName.value, '玩家') });

        conn.on('data', raw => {
            const msg = JSON.parse(raw);
            if (msg.type === 'role' && msg.role === 'spectator') {
                role = 'spectator';
                els.gameInfo.textContent = '房间已满，自动进入观战模式。';
            }
            if (msg.type === 'state') {
                state = msg.state;
                render(msg.state);
            }
        });
        conn.on('close', () => {
            connected = false;
            els.gameInfo.textContent = '连接已断开';
        });
    }

    // 观战者端连接建立后
    function onSpectatorConnect(connection) {
        conn = connection;
        connected = true;
        showGame();
        els.gameInfo.textContent = '已连接房间，进入观战模式。';
        send({ type: 'spectate', name: safeName(els.myName.value, '观众') });

        conn.on('data', raw => {
            const msg = JSON.parse(raw);
            if (msg.type === 'state') {
                state = msg.state;
                render(msg.state);
            }
            if (msg.type === 'gameOver') {
                els.gameInfo.textContent += '  (即将退出观战)';
                setTimeout(() => { destroyPeer(); location.reload(); }, 3000);
            }
        });
        conn.on('close', () => {
            connected = false;
            els.gameInfo.textContent = '连接已断开';
        });
    }

    // 庄家端收到玩家连接后
    function onDealerConnection(connection) {
        conn = connection;
        connected = true;
        showGame();

        connection.on('data', raw => {
            const msg = JSON.parse(raw);
            if (msg.type === 'hello' && role === 'dealer' && !state) {
                newGame(safeName(els.myName.value, '庄家'), safeName(msg.name, '玩家'));
                broadcastState();
            }
            if (msg.type === 'move' && role === 'dealer') {
                if (makeMove(2, msg.row, msg.col)) {
                    broadcastState();
                    if (state.gameOver) {
                        sendToSpectators({ type: 'gameOver' });
                    }
                }
            }
        });
        connection.on('close', () => {
            connected = false;
            els.gameInfo.textContent = '连接已断开';
        });
    }

    // 庄家端收到观战者连接后
    function onSpectatorConnection(connection) {
        const pid = connection.peer;
        connection.on('data', raw => {
            const msg = JSON.parse(raw);
            if ((msg.type === 'spectate' || msg.type === 'hello') && role === 'dealer') {
                spectators.add(pid);
                spectatorConns.set(pid, connection);
                connection.send(JSON.stringify({ type: 'role', role: 'spectator' }));
                if (state) {
                    connection.send(JSON.stringify({ type: 'state', state: publicState('spectator') }));
                }
            }
        });
        connection.on('close', () => {
            spectators.delete(pid);
            spectatorConns.delete(pid);
        });
    }

    // ===================================================================
    //  Peer 管理
    // ===================================================================
    function destroyPeer() {
        if (peer) { peer.destroy(); peer = null; }
        conn = null; connected = false; role = null; mySeat = null; state = null;
        spectators.clear(); spectatorConns.clear();
        els.waitingArea.style.display = 'none';
        els.roomRow.style.display = 'flex';
        els.setup.classList.remove('hidden');
        els.game.classList.add('hidden');
    }

    // ===================================================================
    //  房间操作
    // ===================================================================
    function setupPeerEvents() {
        peer.on('error', err => {
            els.gameInfo.textContent = `错误：${err.type}`;
            if (err.type === 'unavailable-id') {
                els.gameInfo.textContent = '房间码冲突，请重新创建。';
            }
        });
    }

    function createRoom() {
        destroyPeer();
        const code = genCode();
        createRoomWithCode(code);
    }

    function createRoomWithCode(code) {
        destroyPeer();
        role = 'dealer'; mySeat = 1;

        els.roomRow.style.display = 'none';
        els.waitingArea.style.display = 'block';
        els.displayCode.textContent = code;
        els.connectStatus.innerHTML = '<span class="status-dot waiting"></span>等待玩家加入...';

        peer = new Peer(PREFIX + code, { debug: 0 });
        peer.on('open', () => {
            // 房间已创建
        });
        peer.on('connection', connection => {
            if (connected && conn && conn.open) {
                onSpectatorConnection(connection);
            } else {
                onDealerConnection(connection);
                els.connectStatus.innerHTML = '<span class="status-dot ok"></span>玩家已加入，正在连接...';
            }
        });
        setupPeerEvents();
    }

    function joinRoom() {
        const code = els.roomCode.value.trim();
        if (!isValidCode(code)) {
            els.gameInfo.textContent = '请输入 6 位或 8 位数字房间码。';
            return;
        }
        destroyPeer();
        role = 'player'; mySeat = 2;

        peer = new Peer(undefined, { debug: 0 });
        peer.on('open', () => {
            const connection = peer.connect(PREFIX + code, { reliable: true });
            connection.on('open', () => {
                onPlayerConnect(connection);
            });
            connection.on('error', err => {
                els.gameInfo.textContent = `连接失败：${err}`;
            });
            setTimeout(() => {
                if (!connected) els.gameInfo.textContent = '连接超时，请确认房间码正确且庄家在线。';
            }, 8000);
        });
        setupPeerEvents();
    }

    function spectateRoom(code) {
        if (!code) code = els.roomCode.value.trim();
        if (!isValidCode(code)) {
            els.gameInfo.textContent = '请输入 6 位或 8 位数字房间码。';
            return;
        }
        destroyPeer();
        role = 'spectator';

        peer = new Peer(undefined, { debug: 0 });
        peer.on('open', () => {
            const connection = peer.connect(PREFIX + code, { reliable: true });
            connection.on('open', () => {
                onSpectatorConnect(connection);
            });
            connection.on('error', err => {
                els.gameInfo.textContent = `连接失败：${err}`;
            });
            setTimeout(() => {
                if (!connected) els.gameInfo.textContent = '连接超时，请确认房间码正确且房主在线。';
            }, 8000);
        });
        setupPeerEvents();
    }

    // ===================================================================
    //  预设房间
    // ===================================================================
    function initPresetRooms() {
        const grid = document.getElementById('preset-grid');
        PRESET_ROOMS.forEach(room => {
            const card = document.createElement('div');
            card.className = 'preset-card';
            card.dataset.code = room.code;
            card.innerHTML = `
                <div class="room-num">${room.code}</div>
                <div class="room-label">${room.label}</div>
                <div class="click-hint">点击进入</div>
            `;
            card.onclick = () => presetAutoJoin(room.code);
            grid.appendChild(card);
        });
    }

    function presetAutoJoin(code) {
        els.roomCode.value = code;
        destroyPeer();
        let tried = false;
        peer = new Peer(undefined, { debug: 0 });
        peer.on('open', () => {
            const connection = peer.connect(PREFIX + code, { reliable: true });
            const timeout = setTimeout(() => {
                if (!tried) {
                    tried = true;
                    peer.destroy();
                    peer = null;
                    createRoomWithCode(code);
                }
            }, 3500);
            connection.on('open', () => {
                clearTimeout(timeout);
                tried = true;
                role = 'player';
                mySeat = 2;
                onPlayerConnect(connection);
            });
            connection.on('error', () => {
                clearTimeout(timeout);
                if (!tried) {
                    tried = true;
                    peer.destroy();
                    peer = null;
                    createRoomWithCode(code);
                }
            });
        });
        setupPeerEvents();
        // 处理 peer error 时也自动创建
        peer.on('error', () => {
            if (!tried) {
                tried = true;
                if (peer) { peer.destroy(); peer = null; }
                createRoomWithCode(code);
            }
        });
    }

    // ===================================================================
    //  事件绑定
    // ===================================================================
    document.getElementById('btn-create').onclick = createRoom;
    document.getElementById('btn-join').onclick = joinRoom;
    document.getElementById('btn-spectate').onclick = () => spectateRoom();
    document.getElementById('btn-cancel').onclick = () => { destroyPeer(); };
    document.getElementById('btn-exit').onclick = () => { destroyPeer(); };

    // 初始化
    initPresetRooms();
    resizeCanvas();

})();
</script>


</body></html>
